# ZwT Probeplan — Docker-Compose-Setup für den Infomaniak VPS.
# Details/Anleitung: siehe deploy/README.md.
#
# Dienste:
#   - app:      Node.js-Server (server/), Platzhalter bis Phase 3 fertig ist
#   - db:       Postgres, Daten in benanntem Volume (überlebt Container-Neustart)
#   - caddy:    Reverse-Proxy mit automatischem HTTPS (Let's Encrypt)
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down          (Volumes bleiben erhalten)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zwt_probeplan}
      POSTGRES_USER: ${POSTGRES_USER:-zwt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zwt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-zwt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zwt_probeplan}
      ORGANISATOR_BENUTZER: ${ORGANISATOR_BENUTZER:-organisator}
      ORGANISATOR_PASSWORT: ${ORGANISATOR_PASSWORT:?ORGANISATOR_PASSWORT muss in .env gesetzt sein (Phase 7, schützt Schreiboperationen)}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
