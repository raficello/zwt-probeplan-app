<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ZwT Probeplan — Musikerplan</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
  h1 { font-size: 1.1rem; margin: 0 0 0.75rem 0; }
  nav { font-size: 0.9rem; margin-bottom: 0.5rem; }
  .toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .toolbar button { font-size: 1rem; padding: 0.25rem 0.75rem; cursor: pointer; }
  .toolbar input[type="date"] { font-size: 1rem; padding: 0.25rem; }
  .toolbar input[type="text"] { font-size: 1rem; padding: 0.25rem; width: 16rem; }
  .toolbar label { font-size: 0.85rem; color: #555; }
  #status { color: #900; margin-bottom: 0.5rem; }
  /* Vertikale Tagesansicht (Rafi-Feedback, 07.09.2026), siehe
     raumplan.html für dasselbe Muster/dieselben Kommentare. */
  .tagesraster { border: 1px solid #ccc; overflow-x: auto; }
  .tagesraster-kopf, .tagesraster-koerper { display: grid; }
  .tagesraster-kopf > div {
    padding: 0.35rem 0.5rem; font-weight: bold; font-size: 0.85rem;
    border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; background: #f0f0f0;
    position: sticky; top: 0; z-index: 2;
  }
  .tagesraster-zeitspalte, .tagesraster-spalte { position: relative; border-right: 1px solid #eee; }
  .tagesraster-stunde-linie { position: absolute; left: 0; right: 0; border-top: 1px solid #eee; }
  .tagesraster-stunde-label { position: absolute; left: 0.25rem; font-size: 0.7rem; color: #555; }
  .tagesraster-termin {
    position: absolute; left: 2px; right: 2px; border: 1px solid #888; border-radius: 3px;
    font-size: 0.75rem; line-height: 1.2; padding: 0.15rem 0.3rem; overflow: hidden; box-sizing: border-box;
  }
  .legende { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; font-size: 0.85rem; }
  .legende span.kaestchen { display: inline-block; width: 0.9em; height: 0.9em; border: 1px solid #999; vertical-align: middle; margin-right: 0.3em; }
</style>
</head>
<body>
  <h1>ZwT Probeplan — Musikerplan</h1>
  <nav><a href="/raumplan.html">Zur Raumplan-Ansicht</a> <a href="/admin.html">Zur Terminverwaltung</a></nav>
  <div class="toolbar">
    <button id="btnZurueck">&larr; Tag zurück</button>
    <select id="datum"></select>
    <button id="btnVor">Tag vor &rarr;</button>
    <label for="kuerzel">Musiker-Kürzel (leer = alle, die an diesem Tag einen Termin haben):</label>
    <input type="text" id="kuerzel" placeholder="z.B. AB, CD">
  </div>
  <div id="status"></div>
  <div class="tagesraster">
    <div id="tagesrasterKopf" class="tagesraster-kopf"></div>
    <div id="tagesrasterKoerper" class="tagesraster-koerper"></div>
  </div>
  <div class="legende">
    <span><span class="kaestchen" style="background:#ffd9a0"></span>Neu/geändert seit letztem Sperren</span>
    <span><span class="kaestchen" style="background:#b6f2b6"></span>Kzt (Konzertblock — erscheint bei allen)</span>
    <span><span class="kaestchen" style="background:#d7f2d7"></span>K (Konzertstück)</span>
    <span><span class="kaestchen" style="background:#fff3b0"></span>GP / Stimmung</span>
    <span><span class="kaestchen" style="background:#fbd7ea"></span>Aufbau/Apéro/Logistik/Musikeressen</span>
    <span><span class="kaestchen" style="background:#ffffff"></span>Normale Probe</span>
  </div>

  <script src="/color.js"></script>
  <script src="/musiker-logik.js"></script>
  <script src="/tagesraster.js"></script>
  <script>
    var kopfEl = document.getElementById('tagesrasterKopf');
    var koerperEl = document.getElementById('tagesrasterKoerper');
    var PX_PRO_MINUTE = 1.2;
    var MINDESTHOEHE_PX = 16;
    var statusEl = document.getElementById('status');
    var datumInput = document.getElementById('datum');
    var kuerzelInput = document.getElementById('kuerzel');
    var letzteTermine = [];

    // Festival-Tage 2026 (Rafi-Feedback, 06.09.2026: Datumsauswahl überall
    // als Liste der tatsächlichen Tage statt freies Datumsfeld/freie
    // Vor-/Zurück-Rechnung -- Quelle: Google Sheet "ZwT 2026 - Probeplan",
    // Festivalwoche Mo. 12.10.2026 bis So. 18.10.2026). Bei einem
    // künftigen Jahreswechsel hier anpassen.
    var FESTIVAL_TAGE = [
      '2026-10-12', '2026-10-13', '2026-10-14', '2026-10-15',
      '2026-10-16', '2026-10-17', '2026-10-18',
    ];
    var WOCHENTAG_NACH_JS_TAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa']; // Date#getDay(): 0=So

    function wochentagVonDatum(datumStr) {
      var d = new Date(datumStr + 'T00:00:00');
      return WOCHENTAG_NACH_JS_TAG[d.getDay()];
    }

    function fuelleDatumsAuswahl(select) {
      select.innerHTML = '';
      FESTIVAL_TAGE.forEach(function (datum) {
        var opt = document.createElement('option');
        opt.value = datum;
        opt.textContent = wochentagVonDatum(datum) + ', ' + datum.slice(8, 10) + '.' + datum.slice(5, 7) + '.' + datum.slice(0, 4);
        select.appendChild(opt);
      });
    }

    function datumVerschieben(deltaTage) {
      var index = FESTIVAL_TAGE.indexOf(datumInput.value);
      var neuerIndex = index === -1 ? 0 : Math.min(FESTIVAL_TAGE.length - 1, Math.max(0, index + deltaTage));
      datumInput.value = FESTIVAL_TAGE[neuerIndex];
      ladeTag(datumInput.value);
    }

    function gewuenschteKuerzel(termine) {
      var eingabe = kuerzelInput.value.trim();
      if (!eingabe) return ermittleMusikerAusTerminen(termine);
      return eingabe
        .split(/[,\s]+/)
        .map(function (k) { return k.trim().toUpperCase(); })
        .filter(Boolean);
    }

    // Baut die vertikale Tagesansicht komplett neu auf -- siehe
    // raumplan.html für dasselbe Muster/dieselben Kommentare zu
    // tagesraster.js.
    function zeichneTagesraster(groups, items, datum) {
      var fenster = ermittleFenster(datum, items, '07:00:00', '23:00:00');
      var gesamtHoehe = berechnePosition(fenster.ende, fenster.ende, fenster.start, PX_PRO_MINUTE, 0).top;
      var spaltenTemplate = '4rem repeat(' + Math.max(groups.length, 1) + ', minmax(9rem, 1fr))';
      var stunden = stundenraster(fenster.start, fenster.ende);

      kopfEl.innerHTML = '';
      kopfEl.style.gridTemplateColumns = spaltenTemplate;
      kopfEl.appendChild(document.createElement('div'));
      groups.forEach(function (g) {
        var div = document.createElement('div');
        div.textContent = g.content;
        kopfEl.appendChild(div);
      });

      koerperEl.innerHTML = '';
      koerperEl.style.gridTemplateColumns = spaltenTemplate;

      var zeitspalte = document.createElement('div');
      zeitspalte.className = 'tagesraster-zeitspalte';
      zeitspalte.style.height = gesamtHoehe + 'px';
      stunden.forEach(function (stundeIso) {
        var top = berechnePosition(stundeIso, stundeIso, fenster.start, PX_PRO_MINUTE, 0).top;
        var label = document.createElement('div');
        label.className = 'tagesraster-stunde-label';
        label.style.top = top + 'px';
        label.textContent = new Date(stundeIso).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
        zeitspalte.appendChild(label);
      });
      koerperEl.appendChild(zeitspalte);

      groups.forEach(function (g) {
        var spalte = document.createElement('div');
        spalte.className = 'tagesraster-spalte';
        spalte.style.height = gesamtHoehe + 'px';

        stunden.forEach(function (stundeIso) {
          var top = berechnePosition(stundeIso, stundeIso, fenster.start, PX_PRO_MINUTE, 0).top;
          var linie = document.createElement('div');
          linie.className = 'tagesraster-stunde-linie';
          linie.style.top = top + 'px';
          spalte.appendChild(linie);
        });

        items
          .filter(function (it) { return it.group === g.id; })
          .forEach(function (it) {
            var pos = berechnePosition(it.start, it.end, fenster.start, PX_PRO_MINUTE, MINDESTHOEHE_PX);
            var block = document.createElement('div');
            block.className = 'tagesraster-termin';
            block.style.top = pos.top + 'px';
            block.style.height = pos.hoehe + 'px';
            block.style.cssText += ';' + it.style;
            block.textContent = it.content;
            block.title = it.content;
            spalte.appendChild(block);
          });

        koerperEl.appendChild(spalte);
      });
    }

    function aktualisiereAnzeige(datum) {
      var musikerListe = gewuenschteKuerzel(letzteTermine);
      var built = baueMusikerGroupsUndItems(letzteTermine, musikerListe, datum, terminFarbe);

      statusEl.textContent = musikerListe.length === 0
        ? 'Keine Musiker:innen an diesem Tag (oder Kürzel-Filter ergibt keine Treffer).'
        : '';

      zeichneTagesraster(built.groups, built.items, datum);
    }

    function ladeTag(datum) {
      statusEl.textContent = 'Lade...';
      fetch('/api/termine?datum=' + encodeURIComponent(datum))
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          letzteTermine = data.termine;
          aktualisiereAnzeige(datum);
        })
        .catch(function (err) {
          statusEl.textContent = 'Fehler beim Laden: ' + err.message;
        });
    }

    document.getElementById('btnZurueck').addEventListener('click', function () {
      datumVerschieben(-1);
    });
    document.getElementById('btnVor').addEventListener('click', function () {
      datumVerschieben(1);
    });
    datumInput.addEventListener('change', function () {
      ladeTag(datumInput.value);
    });
    kuerzelInput.addEventListener('input', function () {
      if (timeline) aktualisiereAnzeige(datumInput.value);
    });

    var urlParams = new URLSearchParams(window.location.search);
    var startDatum = urlParams.get('datum');
    fuelleDatumsAuswahl(datumInput);
    datumInput.value = FESTIVAL_TAGE.indexOf(startDatum) !== -1 ? startDatum : FESTIVAL_TAGE[0];
    if (urlParams.get('kuerzel')) kuerzelInput.value = urlParams.get('kuerzel');
    ladeTag(datumInput.value);
  </script>
</body>
</html>
